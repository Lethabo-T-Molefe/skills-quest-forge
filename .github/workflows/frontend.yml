name: Frontend CI

# Closes NFR-13 (CI/CD) — this repo previously had no automated pipeline at
# all, only two aspirational architecture diagrams (chieta-cicd-pipeline.xml,
# chieta-data-lake.xml) that nothing executed. Runs type-check, lint, tests,
# and a production build on every push/PR.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
