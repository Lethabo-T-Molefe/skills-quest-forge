# Render blueprint for the DataForge web app: a static site built with Vite.
# The API address comes from .env.production; set VITE_API_URL on the service to override it.
services:
  - type: web
    name: skills-quest-forge
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: checksPass
    routes:
      # The app routes in the browser, so every path must serve index.html. Without this rule, reloading
      # any page other than the home page (or opening a link from an email) returns 404.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://dataforge-backend-8ohs.onrender.com https://dataforge-superset.onrender.com https://dataforge-jupyterhub.onrender.com; frame-src https://dataforge-superset.onrender.com; upgrade-insecure-requests"
